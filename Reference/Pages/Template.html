<!-- This is the template for reference pages.
	The website Builder merges this template with the page contents.
	Fields to be merged are inducated with curly braces {}  -->

<!DOCTYPE html>

<html lang="en-GB">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>SmallJS - Reference</title>
	<link rel="stylesheet" href="/Reference/Reference/default.css" type="text/css" />
	<link id="darkCssLink" href="/Reference/Reference/dark.css" rel="stylesheet" type="text/css" disabled="true" />
	<script src="/Reference/Reference/Script/main.js" type="module"></script>
</head>

<body>
	<div id="titleDiv">
		<div id="titleLeftDiv">
			<button id="menuButton" class="titleButton">&#8801</button>
		</div>
		<div id="titleCenterDiv">
			<img id="logoImage" src="/Reference/Reference/Logo.png" alt="Logo" height="40"></img>
			<span id="titleSpan">&nbsp;&nbsp;SmallJS Reference</span>
		</div>
		<div id="titleRightDiv">
			<button id="themeButton" class="titleButton">&#x25D1;</button>
		</div>
	</div>

	<table id="formTable">
		<tr>
			<th>
				<div id="indexDiv">
					<input id="searchMethodsCheckbox" type="checkbox" />
					<label for="searchMethodsCheckbox">Search methods</label><br>
					<input type="text" id="searchInput" placeholder="Search..." />
					<include src="/Reference/Reference/Pages/Index.html"></include>
				</div>
			</th>
			<td>
				<div id="pageDiv">
					<table id="classTable">
						<tr>
							<th>Class</th>
							<td><code>{class}</code></td>
						</tr>
						<tr>
							<th>Path</th>
							<td><code>{path}</code></td>
						</tr>
						<tr>
							<th>Module</th>
							<td><code>{module}</code></td>
						</tr>
						<tr>
						<tr>
							<th>Superclass</th>
							<td><code>{superclass}</code></td>
						</tr>
						<tr>
							<th>Class vars</th>
							<td><code>{classVars}</code></td>
						</tr>
						<tr>
							<th>Vars</th>
							<td><code>{vars}</code></td>
						</tr>
						<tr>
							<th>Comment</th>
							<td>{comment}</td>
						</tr>
						<tr><td><br></td></tr>
						<tr>
							<th>Class methods</th>
							<td>{classMethods}</td>
						</tr>
						<tr>
							<th>Methods</th>
							<td>{methods}</td>
						</tr>
					</table>
				</div>
			</td>
		</tr>
	</table>
</body>

</html>
